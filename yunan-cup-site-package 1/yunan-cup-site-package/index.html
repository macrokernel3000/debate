<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>育南盃中文教育辯論比賽計分</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">育南盃中文教育辯論比賽</p>
          <h1>辯論賽計分紀錄</h1>
        </div>
        <div class="save-status" id="saveStatus">資料儲存在此瀏覽器</div>
      </header>

      <section class="match-meta" aria-label="比賽資訊">
        <label>
          場次名稱
          <input id="matchName" type="text" placeholder="例：初賽第一場" />
        </label>
        <label>
          日期
          <input id="matchDate" type="date" />
        </label>
        <label>
          備註
          <input id="matchNote" type="text" placeholder="例：A組 / 教室 302" />
        </label>
      </section>

      <section class="cloud-panel" aria-label="雲端儲存設定">
        <div>
          <p>雲端儲存</p>
          <strong id="cloudStatus">尚未連線 Google Sheet</strong>
        </div>
        <label>
          Apps Script 網址
          <input id="cloudEndpoint" type="url" placeholder="貼上 Google Apps Script Web App URL" />
        </label>
        <button id="saveCloudEndpoint" type="button">儲存連線</button>
      </section>

      <section class="scoreboard" aria-label="隊伍總分">
        <article class="side-summary affirmative">
          <div>
            <p>正方總分</p>
            <strong id="affirmativeTotal">0</strong>
          </div>
          <span id="affirmativeBadge">待輸入</span>
        </article>
        <article class="winner-card">
          <p>目前結果</p>
          <strong id="winnerText">尚未判定</strong>
        </article>
        <article class="side-summary negative">
          <div>
            <p>反方總分</p>
            <strong id="negativeTotal">0</strong>
          </div>
          <span id="negativeBadge">待輸入</span>
        </article>
      </section>

      <section class="best-panel" aria-label="單場最佳">
        <p>單場最佳</p>
        <strong id="bestPlayers">尚未產生</strong>
      </section>

      <section class="teams" aria-label="選手分數">
        <article class="team-panel" data-side="affirmative">
          <div class="panel-heading">
            <h2>正方</h2>
            <input id="affirmativeTeam" type="text" placeholder="學校或隊伍名稱" />
            <label class="side-argument">
              論點分
              <input id="affirmativeArgument" type="number" min="0" step="1" inputmode="numeric" />
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>
                <col class="player-col" />
                <col class="score-col" />
                <col class="score-col" />
                <col class="score-col" />
                <col class="total-col" />
                <col class="note-col" />
              </colgroup>
              <thead>
                <tr>
                  <th>選手</th>
                  <th>申論</th>
                  <th>質詢</th>
                  <th>答辯</th>
                  <th>個人總分</th>
                  <th>備註</th>
                </tr>
              </thead>
              <tbody id="affirmativeRows"></tbody>
            </table>
          </div>
        </article>

        <article class="team-panel" data-side="negative">
          <div class="panel-heading">
            <h2>反方</h2>
            <input id="negativeTeam" type="text" placeholder="學校或隊伍名稱" />
            <label class="side-argument">
              論點分
              <input id="negativeArgument" type="number" min="0" step="1" inputmode="numeric" />
            </label>
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>
                <col class="player-col" />
                <col class="score-col" />
                <col class="score-col" />
                <col class="score-col" />
                <col class="total-col" />
                <col class="note-col" />
              </colgroup>
              <thead>
                <tr>
                  <th>選手</th>
                  <th>申論</th>
                  <th>質詢</th>
                  <th>答辯</th>
                  <th>個人總分</th>
                  <th>備註</th>
                </tr>
              </thead>
              <tbody id="negativeRows"></tbody>
            </table>
          </div>
        </article>
      </section>

      <section class="actions" aria-label="操作">
        <button class="primary" id="saveMatch" type="button">儲存本場</button>
        <button id="resetForm" type="button">清空輸入</button>
        <button id="exportRecords" type="button">匯出全部報表</button>
        <button class="danger" id="clearRecords" type="button">刪除全部紀錄</button>
      </section>

      <section class="records-section" aria-label="歷史紀錄">
        <div class="section-heading">
          <h2>比賽紀錄</h2>
          <p id="recordCount">0 筆</p>
        </div>
        <div id="recordsList" class="records-list"></div>
      </section>
    </main>

    <template id="playerRowTemplate">
      <tr>
        <td><input data-field="name" type="text" placeholder="姓名" /></td>
        <td><input data-field="speech" type="number" min="0" step="1" inputmode="numeric" /></td>
        <td><input data-field="question" type="number" min="0" step="1" inputmode="numeric" /></td>
        <td><input data-field="defense" type="number" min="0" step="1" inputmode="numeric" /></td>
        <td><output data-field="total">0</output></td>
        <td><input data-field="note" type="text" placeholder="備註" /></td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
